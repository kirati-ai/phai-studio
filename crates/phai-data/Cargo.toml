[package]
name = "phai-data"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"
authors.workspace = true
description = "Phai Studio's data connections: MySQL / MariaDB servers, their databases, tables and rows"

[lib]
name = "phai_data"
path = "src/lib.rs"

[dependencies]
# The protocol is Phai's own (src/wire.rs); its cryptography is not: hashes, RSA and TLS are
# these crates' and Windows' (SChannel through native-tls).
sha1 = "0.10"
sha2 = "0.10"
rsa = "0.9"
rand = "0.8"
native-tls = "0.2"
# PostgreSQL's SCRAM and MD5 proofs.
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
base64 = "0.22"
md5 = { package = "md-5", version = "0.10" }
# SQLite: the library itself, built in.
rusqlite = { version = "0.32", features = ["bundled"] }

# Windows' DPAPI keeps saved passwords (protect / unprotect); the data server builds elsewhere too.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }
