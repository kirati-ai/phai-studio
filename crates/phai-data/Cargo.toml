[package]
name = "phai-data"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
description = "Phai Studio's data connections: MySQL / MariaDB servers, their databases, tables and rows"

[lib]
name = "phai_data"
path = "src/lib.rs"

[dependencies]
# The protocol is Phai's own (src/wire.rs); its cryptography is not: hashes, RSA and TLS are
# these crates' and Windows' (SChannel through native-tls).
sha1 = "0.10"
sha2 = "0.10"
rsa = "0.9"
rand = "0.8"
native-tls = "0.2"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }
