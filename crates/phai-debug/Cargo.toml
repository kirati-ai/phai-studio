[package]
name = "phai-debug"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
description = "A debugger for Rust programs on Windows, on the Windows debug API and dbghelp"

[lib]
name = "phai_debug"
path = "src/lib.rs"

[dependencies]
# The Disassembly window's x86-64 decoder (MIT). Pinned to a long-standing release.
iced-x86 = { version = "=1.21.0", default-features = false, features = ["std", "decoder", "intel"] }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
