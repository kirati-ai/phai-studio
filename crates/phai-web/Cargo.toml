[package]
name = "phai-web"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
description = "Phai forms in a web browser: the same program as on Windows, compiled to WebAssembly, installable as a PWA on Android and iOS"

[lib]
name = "phai_web"
path = "src/lib.rs"

[dependencies]
wasm-bindgen = "=0.2.130"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "console",
    "CssStyleDeclaration",
    "Document",
    "DomRect",
    "DomTokenList",
    "Element",
    "Event",
    "EventTarget",
    "Headers",
    "HtmlButtonElement",
    "HtmlCanvasElement",
    "HtmlCollection",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlOptionElement",
    "HtmlOptionsCollection",
    "HtmlProgressElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "ImageData",
    "KeyboardEvent",
    "Location",
    "RequestInit",
    "Response",
    "Storage",
    "MouseEvent",
    "Navigator",
    "Node",
    "NodeList",
    "ServiceWorkerContainer",
    "Touch",
    "TouchEvent",
    "TextMetrics",
    "TouchList",
    "WheelEvent",
    "Window",
] }
