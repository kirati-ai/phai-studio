[package]
name = "phai-form"
version.workspace = true
edition.workspace = true
publish.workspace = true
license-file = "../../LICENSES/PolyForm-Perimeter-1.0.1.md"
authors.workspace = true
description = "The form file (.phf): read, check, write, generate Rust from it, and build it live"

[lib]
name = "phai_form"
path = "src/lib.rs"

[dependencies]
phai-ui = { path = "../phai-ui" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }
