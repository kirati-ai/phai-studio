[package]
name = "phai-editor"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
description = "Phai's code editor: Monaco's design in Rust and Win32"

[lib]
name = "phai_editor"
path = "src/lib.rs"

[dependencies]
phai-ui = { path = "../phai-ui" }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }
