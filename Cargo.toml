[workspace]
resolver = "2"
members = ["crates/phai-ui", "crates/phai-form", "crates/phai-design", "crates/phai-editor", "crates/phai-debug", "crates/phai-data", "crates/phai-pack", "crates/phai-web", "apps/setup", "apps/gallery", "apps/studio", "apps/sample"]

[workspace.package]
version = "0.2.2"
edition = "2021"
publish = false
license = "MIT"
# The GitHub address, once the repository exists: new projects then take phai-ui from it.
repository = "https://github.com/kirati-ai/phai-studio"
authors = ["Monrak Net"]

# One `windows` for every crate, as in PhaiDesk: crates written apart do not each pin another.
[workspace.dependencies]
windows = "0.62"
png = "0.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
