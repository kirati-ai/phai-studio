[workspace]
resolver = "2"
members = ["crates/phai-ui", "crates/phai-form", "apps/gallery", "apps/studio", "apps/sample"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
# The GitHub address, once the repository exists: new projects then take phai-ui from it.
repository = ""
authors = ["Monrak Net"]

# One `windows` for every crate, as in PhaiDesk: crates written apart do not each pin another.
[workspace.dependencies]
windows = "0.62"
png = "0.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
