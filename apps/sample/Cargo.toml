[package]
name = "phai-sample"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "A program made from a Phai Studio form: proves the generated code builds and runs"

[[bin]]
name = "phai-sample"
path = "src/main.rs"

[dependencies]
phai-ui = { path = "../../crates/phai-ui" }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
