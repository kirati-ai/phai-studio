[package]
name = "phai-studio"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Phai Studio: design Windows programs in Rust"

[[bin]]
name = "phai-studio"
path = "src/main.rs"

[dependencies]
png = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
phai-ui = { path = "../../crates/phai-ui" }
phai-form = { path = "../../crates/phai-form" }
phai-design = { path = "../../crates/phai-design" }
phai-editor = { path = "../../crates/phai-editor" }
phai-debug = { path = "../../crates/phai-debug" }
phai-data = { path = "../../crates/phai-data" }
phai-pack = { path = "../../crates/phai-pack" }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_Globalization",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# Version information in the .exe (MIT); pinned to a long-standing release.
winresource = "=0.1.31"
