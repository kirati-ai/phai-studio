[package]
name = "phai-gallery"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"
authors.workspace = true
description = "Every phai-ui control in one window, light and dark, Thai and English"

[[bin]]
name = "phai-gallery"
path = "src/main.rs"

[dependencies]
phai-ui = { path = "../../crates/phai-ui" }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
