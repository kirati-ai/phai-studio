[package]
name = "phai-setup"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"
authors.workspace = true
description = "Phai's setup program: installs what is packed on it for the one user, with shortcuts and an uninstaller"

[[bin]]
name = "phai-setup"
path = "src/main.rs"

[dependencies]
phai-pack = { path = "../../crates/phai-pack" }
phai-ui = { path = "../../crates/phai-ui" }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# Version information in the .exe (MIT); pinned to a long-standing release.
winresource = "=0.1.31"
