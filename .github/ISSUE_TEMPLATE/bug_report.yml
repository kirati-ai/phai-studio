name: Bug report / แจ้งบั๊ก
description: Something in Phai Studio, or in a program it made, does not work as it should.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Phai Studio version / รุ่น
      description: Help > About > Copy
      placeholder: "0.2.12"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you did / ทำอะไร
      description: Step by step, so it can be done again. A small project or .phf file helps most.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected / คาดว่าจะเกิดอะไร
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened / เกิดอะไรขึ้น
      description: The message, the Output tab, or a picture.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and display scale / รุ่น Windows และขนาดการแสดงผล
      placeholder: "Windows 11 24H2, 150%"
