# The Form page's examples (docs/help/ctl-form.html): built with the guide, so what the page shows
# is code that compiles. The page quotes src/ between the "// help:" markers.
[package]
name = "form-examples"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
phai-ui = { path = "../../../../crates/phai-ui" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
